<script type="text/plain" data-reference-jsx>
const NS = window.ProspectBoostDesignSystem_668922;

const { Sidebar, Tabs, FilterTabs } = NS;
function Demo() {
  const [active, setActive] = React.useState('home');
  const [view, setView] = React.useState('Board');
  const [f, setF] = React.useState('queued');
  return (<div style={{display:'grid',gridTemplateColumns:'248px 1fr',gap:20,margin:'-20px 0 0 -24px'}}>
    <div style={{height:560}}>
      <Sidebar activeId={active} onSelect={setActive} onCollapse={() => {}}

          { label: 'Personalize', items: [{ id: 'brain', label: 'Brain', icon: 'lightbulb' }, { id: 'skills', label: 'Skills', icon: 'zap' }] },
        ]}
        footer={[{ id: 'settings', label: 'Settings', icon: 'settings' }, { id: 'help', label: 'Help Center', icon: 'circle-help' }]} />
    </div>
    <div style={{paddingTop:20,display:'flex',flexDirection:'column',gap:20}}>
      <div className="sec"><span className="lbl">Tabs (segmented)</span><div className="row"><Tabs items={['Board','List']} value={view} onChange={setView} /><Tabs size="sm" items={['Agent','Settings']} value="Agent" /></div></div>

      </div>
    </div>
  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script><script src="../../runtime/references_components_navigation_navigation.card.js"></script></body></html>
