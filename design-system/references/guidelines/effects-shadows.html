<!-- @dsCard group="Effects" viewport="700x170" name="Elevation" subtitle="Flat by default; shadow only for things that float" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}body{background:var(--bg-canvas)}.r{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.b{height:84px;border-radius:12px;background:#fff;border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px}</style></head><body><div class="r"><div><div class="b" style="box-shadow:var(--shadow-none)"><span class="mono">--shadow-none</span></div><div class="lbl" style="margin-top:6px">cards, panels</div></div><div><div class="b" style="box-shadow:var(--shadow-xs)"><span class="mono">--shadow-xs</span></div><div class="lbl" style="margin-top:6px">selected tab</div></div><div><div class="b" style="box-shadow:var(--shadow-sm)"><span class="mono">--shadow-sm</span></div><div class="lbl" style="margin-top:6px">hovered task</div></div><div><div class="b" style="box-shadow:var(--shadow-md)"><span class="mono">--shadow-md</span></div><div class="lbl" style="margin-top:6px">menus, toasts</div></div><div><div class="b" style="box-shadow:var(--shadow-lg)"><span class="mono">--shadow-lg</span></div><div class="lbl" style="margin-top:6px">dialogs</div></div></div></body></html>
