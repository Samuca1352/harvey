<!-- @dsCard group="Spacing" viewport="700x150" name="Corner radii" subtitle="Soft but not bubbly — 8px controls inside 12px cards" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.r{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.b{height:56px;background:var(--bg-muted);border:1px solid var(--border-default)}</style></head><body><div class="r"><div><div class="b" style="border-radius:3px"></div><div class="mono" style="margin-top:6px">xs · 3</div><div class="lbl">chart bars</div></div><div><div class="b" style="border-radius:6px"></div><div class="mono" style="margin-top:6px">sm · 6</div><div class="lbl">tags, kbd</div></div><div><div class="b" style="border-radius:8px"></div><div class="mono" style="margin-top:6px">md · 8</div><div class="lbl">buttons, chips</div></div><div><div class="b" style="border-radius:10px"></div><div class="mono" style="margin-top:6px">lg · 10</div><div class="lbl">insets</div></div><div><div class="b" style="border-radius:12px"></div><div class="mono" style="margin-top:6px">xl · 12</div><div class="lbl">cards</div></div><div><div class="b" style="border-radius:16px"></div><div class="mono" style="margin-top:6px">2xl · 16</div><div class="lbl">dialogs</div></div><div><div class="b" style="border-radius:24px"></div><div class="mono" style="margin-top:6px">3xl · 24</div><div class="lbl">marketing tiles</div></div><div><div class="b" style="border-radius:28px"></div><div class="mono" style="margin-top:6px">full · 999</div><div class="lbl">pills</div></div></div></body></html>
