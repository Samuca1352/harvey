<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.row{display:flex}.sw{flex:1;height:150px;border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;margin-left:-14px;box-shadow:-6px 0 12px rgba(15,8,22,.04)}.sw:first-child{margin-left:0}.sw b{font:500 18px/1 var(--font-sans)}</style></head><body><div class="row"><div class="sw" style="background:var(--pb-sky-300);color:var(--text-primary)"><span class="lbl" style="color:inherit;opacity:.7">Sky · --pb-sky-300</span><b>#A9D4FF</b></div><div class="sw" style="background:var(--pb-blush-100);color:var(--text-primary)"><span class="lbl" style="color:inherit;opacity:.7">Blush · --pb-blush-100</span><b>#F1E6EC</b></div><div class="sw" style="background:#fff;color:var(--text-primary)"><span class="lbl" style="color:inherit;opacity:.7">White</span><b>#FFFFFF</b></div><div class="sw" style="background:var(--pb-gray-100);color:var(--text-primary)"><span class="lbl" style="color:inherit;opacity:.7">Mist · --pb-gray-100</span><b>#F3F3F5</b></div><div class="sw" style="background:var(--pb-coral-500);color:#fff"><span class="lbl" style="color:inherit;opacity:.7">Coral · --pb-coral-500</span><b>#FB5668</b></div><div class="sw" style="background:var(--pb-ink);color:#fff"><span class="lbl" style="color:inherit;opacity:.7">Ink · --pb-ink</span><b>#0F0816</b></div></div></body></html>
