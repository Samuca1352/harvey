<!-- @dsCard group="Colors" viewport="700x210" name="Signature gradients" subtitle="Sky→blush hero wash; iridescent rim for the one highlight card" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.g{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}.h{height:160px;border-radius:20px;background:var(--gradient-hero);display:flex;align-items:flex-end;padding:14px}.i{height:160px;border-radius:16px;padding:6px;border:1px solid var(--border-subtle)}.i>div{height:100%;border-radius:12px;padding:5px;background:var(--gradient-iris)}.i>div>div{height:100%;border-radius:9px;background:var(--gradient-iris-soft);display:flex;align-items:flex-end;padding:10px}</style></head><body><div class="g"><div class="h"><span class="mono">--gradient-hero</span></div><div class="i"><div><div><span class="mono">--gradient-iris / -soft</span></div></div></div></div></body></html>
