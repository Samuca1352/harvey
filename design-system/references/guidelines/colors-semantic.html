<!-- @dsCard group="Colors" viewport="700x200" name="Semantic aliases" subtitle="Use these in product code — not raw ramps" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.c{height:48px;border-radius:10px;border:1px solid var(--border-subtle)}.n{font:var(--type-meta);color:var(--text-primary);margin-top:6px}</style></head><body><div class="g"><div><div class="c" style="background:var(--bg-app)"></div><div class="n">--bg-app</div><div class="mono">#FFFFFF</div></div><div><div class="c" style="background:var(--surface-tile)"></div><div class="n">--surface-tile</div><div class="mono">gray-50</div></div><div><div class="c" style="background:var(--surface-inset)"></div><div class="n">--surface-inset</div><div class="mono">gray-75</div></div><div><div class="c" style="background:var(--surface-selected)"></div><div class="n">--surface-selected</div><div class="mono">gray-100</div></div><div><div class="c" style="background:var(--border-subtle)"></div><div class="n">--border-subtle</div><div class="mono">gray-150</div></div><div><div class="c" style="background:var(--border-default)"></div><div class="n">--border-default</div><div class="mono">gray-200</div></div><div><div class="c" style="background:var(--text-primary)"></div><div class="n">--text-primary</div><div class="mono">gray-900</div></div><div><div class="c" style="background:var(--text-secondary)"></div><div class="n">--text-secondary</div><div class="mono">gray-600</div></div><div><div class="c" style="background:var(--text-tertiary)"></div><div class="n">--text-tertiary</div><div class="mono">gray-500</div></div><div><div class="c" style="background:var(--action-primary)"></div><div class="n">--action-primary</div><div class="mono">#000000</div></div></div></body></html>
