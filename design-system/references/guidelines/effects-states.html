<!-- @dsCard group="Effects" viewport="700x150" name="Interaction states" subtitle="Hover darkens one step, press scales to .98, focus is a sky ring" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.r{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.c{display:flex;flex-direction:column;gap:6px;align-items:flex-start}</style></head><body><div class="r"><div class="c"><button class="pb-btn pb-btn--primary">Default</button><span class="lbl">default</span></div><div class="c"><button class="pb-btn pb-btn--primary" style="background:var(--action-primary-hover)">Hover</button><span class="lbl">hover · gray-800</span></div><div class="c"><button class="pb-btn pb-btn--primary" style="transform:scale(.98)">Pressed</button><span class="lbl">active · scale .98</span></div><div class="c"><button class="pb-btn pb-btn--secondary" style="box-shadow:var(--ring-focus)">Focus</button><span class="lbl">focus · 3px sky ring</span></div><div class="c"><button class="pb-btn pb-btn--primary" disabled>Disabled</button><span class="lbl">disabled · 45%</span></div><div class="c"><span class="pb-nav-item pb-nav-item--active" style="width:120px">Selected</span><span class="lbl">nav selected · gray-100</span></div></div><div class="lbl" style="margin-top:14px">Motion: 120ms (color) / 180ms (layout) / 280ms (enter) · cubic-bezier(.2,.8,.2,1) · fades + 4px rise, no bounce</div></body></html>
