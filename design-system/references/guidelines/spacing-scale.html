<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>body{padding:20px 24px;background:#fff}.lbl{font:var(--type-label);color:var(--text-tertiary)}.mono{font-family:var(--font-mono);font-size:11px;color:var(--text-secondary)}.r{display:flex;align-items:flex-end;gap:14px}.c{display:flex;flex-direction:column;align-items:center;gap:6px}.b{background:var(--pb-sky-300);border-radius:2px;width:16px}</style></head><body><div class="r"><div class="c"><div class="b" style="height:2px"></div><span class="mono">2</span><span class="lbl">0-5</span></div><div class="c"><div class="b" style="height:4px"></div><span class="mono">4</span><span class="lbl">1</span></div><div class="c"><div class="b" style="height:6px"></div><span class="mono">6</span><span class="lbl">1-5</span></div><div class="c"><div class="b" style="height:8px"></div><span class="mono">8</span><span class="lbl">2</span></div><div class="c"><div class="b" style="height:10px"></div><span class="mono">10</span><span class="lbl">2-5</span></div><div class="c"><div class="b" style="height:12px"></div><span class="mono">12</span><span class="lbl">3</span></div><div class="c"><div class="b" style="height:16px"></div><span class="mono">16</span><span class="lbl">4</span></div><div class="c"><div class="b" style="height:20px"></div><span class="mono">20</span><span class="lbl">5</span></div><div class="c"><div class="b" style="height:24px"></div><span class="mono">24</span><span class="lbl">6</span></div><div class="c"><div class="b" style="height:32px"></div><span class="mono">32</span><span class="lbl">8</span></div><div class="c"><div class="b" style="height:40px"></div><span class="mono">40</span><span class="lbl">10</span></div><div class="c"><div class="b" style="height:48px"></div><span class="mono">48</span><span class="lbl">12</span></div><div class="c"><div class="b" style="height:64px"></div><span class="mono">64</span><span class="lbl">16</span></div></div></body></html>
