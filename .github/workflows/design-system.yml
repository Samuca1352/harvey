name: design-system
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check:design-system
      - name: Check committed reference runtime
        run: git diff --exit-code -- design-system/references
      - run: python -m pip install 'playwright>=1.40,<2'
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/test_design_system_browser.py
